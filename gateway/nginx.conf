# NetZero Hub API gateway: single entry point. "/" serves the web front end; each path prefix goes to its microservice.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s;   # Docker embedded DNS, so restarted containers are found again
    proxy_set_header Host $host;
    proxy_set_header X-Case-Id $http_x_case_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location = /api {
        default_type application/json;
        return 200 '{"platform":"NetZero Hub","services":{"WMA001":"/wma001/","EA01":"/ea01/","WMA002":"/wma002/"},"frontend":"/"}';
    }
    location /       { set $u http://frontend:80;          proxy_pass $u; }
    location /wma001/ { set $u http://wma001-schedule:8000; proxy_pass $u; }
    location /ea01/   { set $u http://ea01-carbon:8000;     proxy_pass $u; }
    location /wma002/ { set $u http://wma002-sorting:8000;  proxy_pass $u; }
}
